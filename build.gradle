plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.0'
    id 'io.spring.dependency-management' version '1.1.5'
}

bootJar.enabled = false

repositories {
    mavenCentral()
}

subprojects {
    group 'kr.yuns'
    version '0.0.1-SNAPSHOT'
    sourceCompatibility = '17'

    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter'
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
		implementation 'org.springframework.boot:spring-boot-starter-data-redis'
        implementation 'org.springframework.boot:spring-boot-starter-security'
		implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
        implementation group: 'org.springframework.cloud', name: 'spring-cloud-starter-aws', version: '2.2.6.RELEASE'
        implementation group: 'org.springframework.boot', name: 'spring-boot-starter-mail', version: '3.4.3'
        implementation group: 'org.springframework.boot', name: 'spring-boot-starter-websocket', version: '3.4.3'
        implementation group: 'org.mariadb.jdbc', name: 'mariadb-java-client', version: '3.5.2'
		implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
        implementation 'io.jsonwebtoken:jjwt:0.12.6'
        implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.0.4'
        compileOnly group: 'org.projectlombok', name: 'lombok'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
		testImplementation 'org.springframework.security:spring-security-test'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }

    test {
        useJUnitPlatform()
    }
}